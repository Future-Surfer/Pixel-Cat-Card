name: Seeded interaction soak
on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'
permissions:
  contents: read
jobs:
  interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 19, 43, 107, 991]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.0'
      - run: npm run build
      - run: node scripts/test-all.mjs --suite test-cat-interactions.mjs --seeds ${{ matrix.seed }}
      - name: Preserve seed and failure trace
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interaction-seed-${{ matrix.seed }}
          path: .test-artifacts/node/
          include-hidden-files: true
          if-no-files-found: ignore
