name: Prepare release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, matching package.json (e.g. v1.0.0-rc.2)
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.0'
      - name: Validate version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e "const p=require('./package.json');if(process.env.RELEASE_TAG!=='v'+p.version)throw Error('Tag must match package.json');"
      - run: npm run verify:build
      - run: npm test
      - run: npm run release:build
      - run: git diff --exit-code
      - name: Create immutable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace its assets.' >&2
            exit 1
          fi
          release_flags=(--verify-tag --draft)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/pixel-cat-card.js dist/pixel-cat-card.manifest.json dist/SHA256SUMS "${release_flags[@]}" --title "Pixel Cat Card $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
