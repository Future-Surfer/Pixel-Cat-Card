name: Verify Pixel Cat
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.0'
      - run: npm run verify:build
      - run: npm test
      - run: npm run release:build
      - run: git diff --exit-code -- dist pixel-cat-roaming.js pixel-cat-roaming-art.js pixel-cat-roaming-extras.js pixel-cat-behaviours.js pixel-cat-affordances.js pixel-cat-climbing.js frame-studio/dist/library.json frame-studio/dist/asset-review.json frame-studio/SEQUENCE_AUDIT.md frame-studio/LATEST_ASSET_REVIEW.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixel-cat-roaming
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixel-cat-card
          path: dist/
          if-no-files-found: error
