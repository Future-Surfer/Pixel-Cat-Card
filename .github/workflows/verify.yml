name: Verify Pixel Cat
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.20.0'
      - run: npm run verify:build
      - run: npm test
      - run: npm run release:build
      - run: git diff --exit-code -- dist pixel-cat-roaming.js pixel-cat-roaming-art.js pixel-cat-roaming-extras.js pixel-cat-behaviours.js pixel-cat-affordances.js pixel-cat-climbing.js frame-studio/dist/library.json frame-studio/dist/asset-review.json frame-studio/SEQUENCE_AUDIT.md frame-studio/LATEST_ASSET_REVIEW.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixel-cat-roaming
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixel-cat-card
          path: dist/
          if-no-files-found: error
