<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Cat welcome test</title><style>
body{margin:0;background:#f1f5f7;color:#233641;font:14px system-ui}header,main{max-width:1000px;margin:28px auto;padding:0 24px}main{display:grid;grid-template-columns:1fr 1fr;gap:64px 24px}.shelf{padding:24px;border:1px solid #cad5dd;border-radius:12px;background:white;min-height:150px;box-sizing:border-box}button,select{font:inherit;padding:9px;margin-right:8px}output{display:block;margin:18px 0;font:12px monospace}pixel-cat-home{min-width:0}@media(max-width:650px){main{grid-template-columns:1fr}}</style></head><body><header><h1>Welcome home</h1><p>Use the real resident lifecycle, with no Home Assistant writes. Welcome replaces only this test resident.</p><label>Pixel scale <select id="scale"><option>1</option><option selected>2</option><option>3</option></select></label><button id="welcome">Welcome cat</button><button id="monitor">Use as monitor</button><output id="state">Choose Welcome cat to test emergence.</output></header><main data-cat-world><div id="slot"></div><div class="shelf" data-cat-surface><h2>Neighbouring shelf</h2><p>A place to wander after settling.</p></div><div class="shelf" data-cat-surface><h2>A lower shelf</h2></div></main><script type="module">
import '../pixel-cat-roaming-art.js';import '../pixel-cat-roaming-extras.js';import '../pixel-cat-affordances.js';import '../pixel-cat-behaviours.js';import '../pixel-cat-roaming.js';
let cat;
document.querySelector('#welcome').onclick=()=>{cat?.remove();cat=document.createElement('pixel-cat-home');cat.setConfig({...cat.constructor.getStubConfig(),name:'Pebble',color:'#70818d',cell_size:Number(document.querySelector('#scale').value)});document.querySelector('#slot').replaceChildren(cat);};
document.querySelector('#monitor').onclick=()=>{if(!cat)return;cat.setConfig({...cat.config,mode:'monitor',title:'Welcome test performance'});};
setInterval(()=>{if(cat)document.querySelector('#state').textContent=JSON.stringify({mode:cat.config.mode||'companion',active:!!cat.active,phase:cat.arriving?'emerging':cat.arrived?'arrived':'waiting',x:Math.round(cat.x||0),overlays:document.querySelectorAll('[data-pixel-cat-overlay]').length});},100);
</script></body></html>
