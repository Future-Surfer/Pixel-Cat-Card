<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pixel cat dashboard roaming fixture</title><script defer src="../frame-studio/dist/lab-nav.js"></script>
<style>body{font:15px system-ui;background:#eff1f4;color:#24313d;margin:0}header{height:64px;position:sticky;top:0;background:#263849;color:white;z-index:20;display:flex;align-items:center;padding:0 24px}main{padding:64px 24px 120px;max-width:1040px;margin:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:90px 24px}.surface{background:white;border:1px solid #d2d9e0;border-radius:12px;padding:20px;min-height:110px;box-shadow:0 2px 8px #0001;overflow:hidden}.value{font-size:40px}.graph{height:60px;background:linear-gradient(170deg,transparent 45%,#d19a47 46%,#d19a47 50%,transparent 51%)}button{padding:8px;cursor:pointer}footer{height:500px;padding:24px}pixel-cat-home{grid-column:span 1}dialog{z-index:30} @media(max-width:700px){main{grid-template-columns:1fr;gap:80px;padding:60px 20px}}</style>
<header>Pixel Cat · dashboard roaming fixture</header><main data-cat-world>
<pixel-cat-home></pixel-cat-home><div class="surface" data-cat-surface><b>Indoor temperature</b><div class="value">21°</div><button id="probe">Click-through check: <span>0</span></button></div><div class="surface" data-cat-surface><b>Outside</b><div class="value">14°</div></div>
<div class="surface" data-cat-surface><b>Energy today</b><div class="graph"></div><button id="dialog">Open dialog</button></div><div class="surface" data-cat-surface><b>Living room</b><p>Ordinary clipped card container</p><button id="remove">Remove this card</button></div><div class="surface" data-cat-surface><b>Weather</b><div class="value">☀</div></div>
</main><footer>Scroll and resize to test changing geometry.</footer><aside style="position:fixed;top:70px;left:24px;z-index:20;font:12px system-ui"><button id="audit-up">Audit ascent</button> <button id="audit-down">Audit descent</button> <button id="audit-across">Audit across</button> <button id="audit-next">Next jump frame</button> <span id="audit-label"></span></aside><dialog role="dialog"><p>Cat should be hidden while this dialog is open.</p><form method="dialog"><button>Close</button></form></dialog>
<script type="module">import '../pixel-cat-roaming-art.js';import '../pixel-cat-roaming-extras.js';import '../pixel-cat-affordances.js';import '../pixel-cat-behaviours.js';import '../pixel-cat-roaming.js';document.querySelector('pixel-cat-home').setConfig({cell_size:2,cat_id:'fixture-cat'});let clicks=0;const probe=document.querySelector('#probe');probe.onclick=()=>probe.querySelector('span').textContent=++clicks;document.querySelector('#dialog').onclick=()=>document.querySelector('dialog').showModal();document.querySelector('#remove').onclick=e=>e.target.closest('.surface').remove();
// Open shadow-root wrappers approximate HA's component boundaries. Each
// ordinary card still clips its contents; the cat is mounted outside it.
for(const surface of [...document.querySelectorAll('.surface')]){const host=document.createElement('fixture-card');surface.before(host);const root=host.attachShadow({mode:'open'});const style=document.createElement('style');style.textContent='.surface{background:white;border:1px solid #d2d9e0;border-radius:12px;padding:20px;min-height:110px;overflow:hidden;font:15px system-ui}.value{font-size:40px}button{padding:8px;cursor:pointer}.graph{height:60px;background:linear-gradient(170deg,transparent 45%,#d19a47 46%,#d19a47 50%,transparent 51%)}';root.append(style,surface);}
// Fixture-only frame inspection. This does not ship in the HA module.
const home=document.querySelector('pixel-cat-home');let auditKind='ascend',auditFrame=0;
function audit(){
  if(!home.surfaces?.[1])return;
  home.paused=true;
  const forward=auditKind!=='descend';
  const a=auditKind==='ascend'?home.home:home.surfaces[1];
  const b=auditKind==='across'?home.surfaces[2]:auditKind==='ascend'?home.surfaces[1]:home.home;
  if(!b)return;
  const holds=auditKind==='across'?[1,2,2,2]:auditKind==='ascend'?[1,3,1,1,1]:[1,1,1,3];
  const motion={fromX:forward?a.max:a.min,fromY:a.top,x:forward?b.min:b.max,y:b.top,direction:forward?1:-1,jumpKind:auditKind,holds};
  const plan=home.planJump(motion);if(!plan){document.querySelector('#audit-label').textContent='Jump outside physical limits';return;}const before=plan.durations.slice(0,auditFrame).reduce((x,y)=>x+y,0),total=plan.duration;
  const pose=home.jumpSample(motion,(before+plan.durations[auditFrame]*.5)/total);
  home.facing=motion.direction;home.layer.style.visibility='visible';home.draw(pose.rows);
  home.svg.style.transform=`translate(${pose.x}px,${pose.top}px)`;
  document.querySelector('#audit-label').textContent=`${auditKind} ${auditFrame+1}/${holds.length}`;
}
document.querySelector('#audit-up').onclick=()=>{auditKind='ascend';auditFrame=0;audit();};
document.querySelector('#audit-down').onclick=()=>{auditKind='descend';auditFrame=0;audit();};
document.querySelector('#audit-across').onclick=()=>{auditKind='across';auditFrame=0;audit();};
document.querySelector('#audit-next').onclick=()=>{auditFrame=(auditFrame+1)%(auditKind==='ascend'?5:4);audit();};
</script></html>
