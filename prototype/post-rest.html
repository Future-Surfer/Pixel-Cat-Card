<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cat rest and primary-home fixture</title><style>body{margin:0;background:#edf1f5;color:#243442;font:14px system-ui}main{position:relative;max-width:1100px;margin:auto;padding:20px}h1{font-size:22px}button{padding:10px;margin:6px}#cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}@media(max-width:750px){#cats{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><main data-cat-world><h1>Independent waking · 20 cats</h1><p>The test button simulates a completed rest episode; ordinary runtime decisions choose what happens next. No artwork or HA configuration is saved.</p><button id="sleep">Simulate waking after sleep</button><button id="loaf">Simulate leaving a loaf</button><label><input id="edit" type="checkbox"> Edit-mode primary flags</label><output id="summary"></output><div id="cats"></div></main><script type="module">import '../pixel-cat-roaming-art.js';import '../pixel-cat-roaming-extras.js';import '../pixel-cat-affordances.js';import '../pixel-cat-behaviours.js';import '../pixel-cat-roaming.js';const world=document.querySelector('main'),actors=[];for(let i=0;i<20;i++){const a=document.createElement('pixel-cat-home');a.setConfig({...a.constructor.getStubConfig(),cat_id:'rest-fixture-'+i,name:'Rest cat '+(i+1),arrival:undefined,cell_size:2,show_controls:true,dashboard_props:false,interaction_behaviour:false,social_behaviour:false,mood_behaviour:true,debug_labels:false,bed_style:i%2?'simple':'igloo'});document.querySelector('#cats').append(a);actors.push(a);}const wake=pose=>{for(const a of actors){a.requestAction(pose);a.previewPose=null;a.forcedIdleUntil=0;a.play=null;a.route=[];a.motion=null;a.idle={pose,start:performance.now()-20000,poseUntil:performance.now()-1,support:a.support.id,contactX:a.x+17*a.scale};a.postRest={clock:20000,since:0,resting:true,slept:pose==='sleep',initial:0,until:0};a.deadline=performance.now();}};document.querySelector('#sleep').onclick=()=>wake('sleep');document.querySelector('#loaf').onclick=()=>wake('loaf');document.querySelector('#edit').onchange=e=>{world.editMode=e.target.checked;};setInterval(()=>{const states=actors.map(a=>a.getAttribute('data-post-rest')).filter(Boolean);document.querySelector('#summary').textContent=' '+states.length+' cats easing out of rest; first home primary: '+actors[0].config.primary_home+', second: '+actors[1].config.primary_home;},200);</script></html>
