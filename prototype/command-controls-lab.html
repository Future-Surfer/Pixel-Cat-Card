<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>On-card command lab</title>
<style>body{font:15px system-ui;background:#edf0f4;margin:20px;color:#243442}main{max-width:1100px;margin:auto}#stage{position:relative;height:390px}ha-card{display:block;background:#fff;border:1px solid #778f9d;border-radius:10px;box-sizing:border-box}#wall{position:absolute;left:45%;top:40px;width:30%;height:230px;padding:15px}#floor{position:absolute;left:0;right:0;top:300px;height:50px}#homes{display:flex;gap:15px}pixel-cat-home{flex:1;min-width:0}pre{height:150px;overflow:auto;white-space:pre-wrap}button{padding:7px;margin:4px}</style>
<main data-cat-world><h1>On-card commands</h1><p>Real runtime; autonomy is off. Test the actual Startle all and Wall jump buttons. Fixture controls only arrange safe test conditions.</p><button id="reset">Place cats on floor</button><button id="rest">Settle all three cats</button><button id="remove">Toggle wall</button><button id="step">Run 10 simulated seconds</button><div id="stage"><ha-card id="wall" data-cat-climb="on">Visible finite wall and landing top</ha-card><ha-card id="floor" data-cat-surface>Broad landing floor</ha-card></div><div id="homes"></div><pre id="report"></pre></main>
<script type="module">
import '../pixel-cat-roaming-art.js';import '../pixel-cat-roaming-extras.js';import '../pixel-cat-affordances.js';import '../pixel-cat-behaviours.js';import '../pixel-cat-roaming.js';import '../pixel-cat-climbing.js';
let clockOffset=0;const actors=[],history=[],$=s=>document.querySelector(s),art={...window.pixelCatRoamingArtV2,...window.pixelCatRoamingExtrasV1,idleSequences:{...window.pixelCatRoamingArtV2.idleSequences,...window.pixelCatRoamingExtrasV1.idleSequences,...window.pixelCatRoamingExtensionsV1.idleSequences}};
for(const [i,age]of ['kitten','adult','senior'].entries()){const a=document.createElement('pixel-cat-home');a.setConfig({...a.constructor.getStubConfig(),cat_id:'command-'+age,name:age,life_stage:age,arrival:undefined,cell_size:2,show_controls:true,card_climbing:false,interaction_behaviour:false,social_behaviour:false,mood_behaviour:false,playful_pounces:false,dashboard_props:false,debug_labels:true});const tick=a.tick;a.labTick=t=>tick.call(a,t);a.tick=t=>tick.call(a,t+clockOffset);$('#homes').append(a);actors.push(a);}
function place(){for(const [i,a]of actors.entries()){window.pixelCatClimbV1.cancel(a,'lab reset',false);a.manualStartle=a.manualWallJump=null;a.paused=false;a.motion=a.idle=a.goal=a.command=a.previewPose=null;a.route=[];a.measure();a.support=a.surfaces.find(s=>s.el===$('#floor')&&!s.internal);a.x=a.support.min+40+i*280;a.y=a.support.top;a.deadline=performance.now()+120000;window.pixelCatSettlingV1.wake(a,performance.now());}history.length=0;}
$('#reset').onclick=place;$('#rest').onclick=()=>{place();for(const a of actors){const t=a.lastTick||performance.now()-20;a.settling={activeMs:300000,idle:null};a.idle={pose:'loaf',start:t,bridge:[],bridgeMs:0,poseUntil:t+10000,support:a.support.id,contactX:a.x+17*a.scale};window.pixelCatSettlingV1.begin(a,a.idle,art);}};
$('#remove').onclick=()=>{$('#wall').hidden=!$('#wall').hidden;$('#wall').style.display=$('#wall').hidden?'none':'block';for(const a of actors)a.invalidate();};
const states=()=>actors.map(a=>({name:a.config.name,status:a.shadowRoot.querySelector('.status-action').textContent,climb:a.getAttribute('data-climb'),route:a.route?.length,x:Math.round(a.x),y:Math.round(a.y),settled:a.getAttribute('data-settling'),startle:a.getAttribute('data-manual-startle'),wall:a.getAttribute('data-wall-jump-command'),transfer:a.climb?.nativeTransfer?.kind,phase:a.climb?.sample?.phase,action:a.motion?.kind,support:a.support?.label,queued:!!(a.manualStartle||a.manualWallJump)}));
$('#step').onclick=()=>{const base=performance.now()+clockOffset;for(let dt=16;dt<=10000;dt+=16){for(const a of actors){cancelAnimationFrame(a.raf);a.labTick(base+dt);}if(dt%160===0)history.push(states());}clockOffset+=Math.floor(10000/16)*16;};
setInterval(()=>{$('#report').textContent=JSON.stringify({actors:states(),observed:history.slice(-5)},null,2);},250);
</script><script defer src="../frame-studio/dist/lab-nav.js" data-workshop-nav="floating"></script></html>
