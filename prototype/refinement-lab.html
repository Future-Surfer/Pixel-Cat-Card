<!doctype html><html lang="en"><meta charset="utf-8"><title>Pixel Cat refinement lab</title><style>body{margin:0;background:#eef1f5;color:#243442;font:14px system-ui}main{position:relative;max-width:1200px;margin:auto;padding:20px}button,select{padding:8px;margin:5px}#stage{position:relative;height:430px}article{position:absolute;box-sizing:border-box;background:white;border:1px solid #adb9c5;border-radius:8px;padding:10px}#upper{left:40px;right:40px;top:280px;height:36px}#lower{left:40px;right:40px;top:292px;height:36px;background:#dae9e8}#wall{left:48%;width:120px;top:70px;height:210px;background:#d9d4e9}#homes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}output{display:block;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0}#extra{display:grid;grid-template-columns:repeat(8,1fr);gap:20px;margin-top:25px}#extra>div{height:40px;background:#fff;border:1px solid #bdc9d3}#monitor{margin-top:20px}@media(max-width:700px){#homes{grid-template-columns:1fr}#extra{grid-template-columns:repeat(4,1fr)}} </style>
<main data-cat-world><h1>Names, depth, surfaces & motion</h1><p>Controlled previews use the real runtime. Native card-edge scratching is enabled only in this lab. Autonomous watching keeps ordinary gaze, moods, claims and independent choices.</p><label>Cats <select id="count"><option>1</option><option>5</option><option>20</option></select></label><label>Extra cards <select id="supports"><option>0</option><option>32</option><option>64</option><option>128</option><option>256</option><option>512</option></select></label><label>Pixel scale <select id="scale"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select></label><label>Life stage <select id="life-stage"><option value="adult">Adult</option><option value="kitten">Kitten</option><option value="senior">Senior</option><option value="mixed">Mixed ages</option></select></label><label>Bed <select id="bed-style"><option value="igloo">Igloo</option><option value="simple">Simple</option></select></label><button id="bed-left">Rest in bed from left</button><button id="bed-right">Rest in bed from right</button><button id="shallow">Grounded shallow crossing</button><button id="post-lower">Post on lower surface</button><button id="cat-lower">Cat on lower surface</button><label>Test cat colour <input id="cat-colour" type="color" value="#185ed2"></label><button id="home-scratch">Scratch home post (controlled)</button><button id="native">Scratch native edge</button><label><input id="hold-contact" type="checkbox"> Hold contact preview</label><button id="observe">Watch autonomous post use</button><button id="loaf">Prepare loaf</button><button id="walk">Walk out of loaf</button><label>Cadence gait <select id="cadence-gait"><option value="natural">Preferred pace</option><option>walk</option><option>trot</option><option>sneak</option><option>gallop</option></select></label><button id="cadence">Compare movement cadence</button><button id="alert-rest">Loaf → alert rest</button><label>Ear cycle frame <select id="ear-rate"><option>60</option><option selected>75</option><option>90</option></select> ms</label><label>Ear facing <select id="ear-facing"><option value="1">Right</option><option value="-1">Left</option></select></label><label><input id="fur-every" type="checkbox"> Every ear contact (lab only)</label><button id="ear">Preview fast ear scratch</button><button id="fur-audit">Inspect fur origins and drift</button><canvas id="fur-proof" width="640" height="215" hidden aria-label="Actual ear frame and fur positions at birth, 120 and 240 milliseconds in both facings"></canvas><button id="vertical">Toggle vertical diagnostics</button><details><summary>Contact effect recipe</summary><label><input type="checkbox" id="effects-on" checked> Effects enabled</label><label>Fibres per stroke <input id="particle-count" type="number" min="0" max="4" value="2"></label><label>Spawn chance (%) <input id="particle-chance" type="number" min="0" max="100" value="65"></label><label>Lifetime (ms) <input id="particle-life" type="number" min="200" max="2500" value="1300"></label><label>Gravity (cells/s²) <input id="particle-gravity" type="number" min="10" max="180" value="70"></label><label>Size (cell fraction) <input id="particle-size" type="number" min="0.15" max="0.49" step="0.01" value="0.46"></label><button id="apply-particles">Apply rope recipe</button><button id="emit-particles">Emit recipe preview</button></details><div id="stage"><article id="wall" data-cat-surface>Structural edge</article><article id="upper" data-cat-surface>Upper support</article><article id="lower" data-cat-surface>Lower support (+12 px)</article></div><button id="lift">Preview saved lift grip</button><canvas id="grip" width="320" height="150" hidden aria-label="Saved hanging pose and cursor grip in both facings"></canvas><div id="homes"></div><div id="monitor"></div><output id="state"></output><div id="extra"></div></main>
<script type="module">
import '../pixel-cat-roaming-art.js';import '../pixel-cat-roaming-extras.js';import '../pixel-cat-affordances.js';import '../pixel-cat-behaviours.js';import '../pixel-cat-roaming.js';import '../pixel-cat-climbing.js';
const $=s=>document.querySelector(s),actors=[];let note='Ordinary independent activity';
function create(){for(const a of actors)a.remove();actors.length=0;for(let i=0;i<Number($('#count').value);i++){const a=document.createElement('pixel-cat-home');a.setConfig({...a.constructor.getStubConfig(),cat_id:'refinement-'+i,arrival:undefined,cell_size:Number($('#scale').value),life_stage:$('#life-stage').value==='mixed'?['kitten','adult','senior'][i%3]:$('#life-stage').value,bed_style:$('#bed-style').value,show_controls:true,debug_labels:true,color:$('#cat-colour').value,native_vertical_surfaces:true,bowl_eating:false,dashboard_props:false,effects:$('#effects-on').checked});$('#homes').append(a);actors.push(a);}}
$('#cadence').onclick=()=>{const gait=$('#cadence-gait').value,report=[];for(const a of actors){const support=a.surfaces.find(s=>s.el===$('#upper'));if(!support)continue;a.social?.finish('controlled cadence');a.cancelPlay();a.route=[];a.idle=null;a.paused=false;a.support=support;a.x=support.min;a.y=support.top;const prior={...a.config};a.config.fast_walk=['natural','trot'].includes(gait);a.config.gallop=['natural','gallop'].includes(gait);a.urgency=gait==='natural'?'casual':gait==='trot'?'prompted':'relaxed';a.moveTo(Math.min(support.max,a.x+72*a.scale),a.y,10000,'walk',support,performance.now(),['natural','walk'].includes(gait)?undefined:gait);a.config=prior;const m=a.motion;report.push({age:a.lifeStage,gait,chosen:a.getAttribute('data-gait'),lastOrdinaryPace:a.getAttribute('data-pace-choice'),factor:m.cadenceFactor||1,durationMs:Math.round(m.duration),cells:m.cells,scale:a.scale});}note='Controlled real runtime cadence: '+JSON.stringify(report);};
$('#cat-colour').onchange=()=>{for(const a of actors)a.config.color=$('#cat-colour').value;};$('#count').onchange=create;$('#bed-style').onchange=create;$('#life-stage').onchange=create;$('#scale').onchange=create;create();const monitor=document.createElement('pixel-cat-monitor');monitor.setConfig({title:'Refinement lab performance'});$('#monitor').append(monitor);
$('#supports').onchange=()=>{$('#extra').replaceChildren(...Array.from({length:Number($('#supports').value)},(_,i)=>{const d=document.createElement('div');d.dataset.catSurface='';d.textContent='Card '+i;return d;}));for(const a of actors)a.invalidate();};
function reset(a){window.pixelCatBedEntryV1.moving(a);a.social?.finish('controlled lab reset');a.paused=false;a.motion=null;a.route=[];a.goal=a.command=null;a.previewPose=null;a.play=null;a.mouthAction=null;a.toyHunt=null;a.playRequested=false;a.toyHuntRequested=false;a.recallPending=false;a.idle=null;a.deadline=performance.now()+120000;a.measure();}
function placeDepth(postLower){const a=actors[0];reset(a);const scene=a.ensurePropScene();scene.clear();const p=scene.spawn(a,'scratching_post');if(!p){note='No post support';return;}const catFloor=a.surfaces.find(s=>s.el===$(postLower?'#upper':'#lower')&&!s.internal),postFloor=a.surfaces.find(s=>s.el===$(postLower?'#lower':'#upper')&&!s.internal);if(!catFloor||!postFloor)return;p.surfaceEl=postFloor.el;p.surfaceSuffix=postFloor.id.slice(postFloor.id.indexOf(':'));p.u=.5;a.support=catFloor;a.x=(catFloor.left+catFloor.right)/2-12*a.scale;a.y=catFloor.top;const t=performance.now();a.idle={pose:'sit',start:t,poseUntil:t+120000,contactX:a.x+12*a.scale,support:catFloor.id};a.idle.placement={x:a.x,top:a.y-24*a.scale};a.draw(window.pixelCatRoamingArtV2.idleSequences.sit.frames[0]);a.svg.style.transform=`translate(${a.x}px,${a.y-24*a.scale}px)`;a.paused=true;scene.tick(t,a);window.pixelCatDepthV1.cat(a,t);note=postLower?'Post is closer: its rope must cover the cat':'Cat is closer: it must cover the rope';}
function bedEntry(side){const a=actors[0];reset(a);a.support=a.home;const asset=window.pixelCatSetupV1.bed(a,window.pixelCatRoamingExtrasV1),center=a.home.left-4+(22+asset.width/2)*(a.worldScale||a.scale);a.x=center-12*a.scale+side*20*a.scale;a.y=a.home.top;a.facing=-side;a.previewBedPose='loaf';note='Controlled bed entry from '+(side>0?'right':'left')+'; watch the approach before resting';}
$('#bed-left').onclick=()=>bedEntry(-1);$('#bed-right').onclick=()=>bedEntry(1);
$('#shallow').onclick=()=>{const a=actors[0];reset(a);const from=a.surfaces.find(s=>s.el===$('#upper')&&!s.internal),to=a.surfaces.find(s=>s.el===$('#lower')&&!s.internal);a.support=from;a.x=from.min+50*a.scale;a.y=from.top;a.route=[to];a.shallowChoice={key:from.id+'>'+to.id,walk:true};a.advance(performance.now());note='Controlled grounded crossing: 12 CSS px of height, native stride clock';};
$('#post-lower').onclick=()=>placeDepth(true);$('#cat-lower').onclick=()=>placeDepth(false);
$('#native').onclick=()=>{const a=actors[0];reset(a);const layer=a.decisionLayer(),f=window.pixelCatVerticalScratchV1.faces(layer).find(f=>f.prop.native&&f.prop.visualOwner===$('#wall')&&f.surface.el===$('#upper'));if(!f){note='No eligible native face';return;}a.support=f.surface;a.x=Math.max(f.surface.min,f.origin-24*a.scale);a.y=f.surface.top;note=window.pixelCatVerticalScratchV1.start(layer,f,performance.now())?'Controlled native edge requested':'Native stance unavailable';};
$('#home-scratch').onclick=()=>{const a=actors[0];reset(a);const layer=a.decisionLayer();if(a.homePost)a.homePost.cooldownUntil=0;const face=window.pixelCatVerticalScratchV1.faces(layer).find(f=>f.prop.homeOwner===a);if(!face){note='No available home post stance (wait for cooldown or reload)';return;}a.support=face.surface;a.x=face.origin;a.y=face.surface.top;note=window.pixelCatVerticalScratchV1.start(layer,face,performance.now())?'Controlled home post; real contact events drive wiggle and fibres':'Home post approach unavailable: '+JSON.stringify({available:layer.available(a),layout:a.layoutPaused,suspended:a.suspended,stranded:a.stranded,path:!!a.pathTo(face.surface),clear:layer.clear(face.surface,face.origin),claimed:face.prop.claimedBy});};
$('#effects-on').onchange=()=>{for(const a of actors)a.config.effects=$('#effects-on').checked;if(!$('#effects-on').checked)window.pixelCatEffectsV1.clear(actors[0].root);};
$('#apply-particles').onclick=()=>{const clamp=(id,lo,hi)=>Math.max(lo,Math.min(hi,Number($(id).value)||0)),r=window.pixelCatEffectsV1.recipes.rope;r.count=clamp('#particle-count',0,4);r.probability=clamp('#particle-chance',0,100)/100;r.life=clamp('#particle-life',200,2500);r.gravity=clamp('#particle-gravity',10,180);r.size=clamp('#particle-size',.15,.49);note='Local rope recipe applied; shared pool/spawn caps remain fixed';};
$('#emit-particles').onclick=()=>{const a=actors[0];a.paused=false;const p=a.homePost;if(!p)return;const face=window.pixelCatVerticalScratchV1.faces(a.decisionLayer(),false,true).find(f=>f.prop===p);if(!face)return;const contact=window.pixelCatEffectsV1.postContact(face,{y:(face.top+face.bottom)/2});window.pixelCatEffectsV1.emit(a,'rope',contact.point,a.home,'preview-'+performance.now(),p.scale,contact);note='Recipe-only preview; not counted as a physical scratch stroke';};
$('#observe').onclick=()=>{$('#hold-contact').checked=false;for(const a of actors){reset(a);a.propScene?.clear();a.support=a.home;a.x=a.home.left+18*a.scale;a.y=a.home.top;a.facing=1;a.idle=null;a.deadline=performance.now()+3000;}note='Autonomous observation: no seeded gaze memory or forced acceptance';};
$('#loaf').onclick=()=>{const a=actors[0];reset(a);a.support=a.surfaces.find(s=>s.el===$('#upper')&&!s.internal);a.x=a.support.min+24*a.scale;a.y=a.support.top;const t=performance.now();a.idle={pose:'loaf',start:t,poseUntil:t+120000,contactX:a.x+12*a.scale,support:a.support.id};note='Loaf prepared; next button requests ordinary walking';};
$('#alert-rest').onclick=()=>{const a=actors[0];if(a.idle?.pose!=='loaf'){note='Prepare loaf first';return;}a.previewPose=null;a.previewBedPose='alertLying';a.idle.poseUntil=0;a.deadline=performance.now()+120000;note='Ordinary authored loaf exit → alert rest; no sitting detour';};
$('#walk').onclick=()=>{const a=actors[0];a.moveTo(Math.min(a.support.max,a.x+45*a.scale),a.support.top,0,'walk',a.support,performance.now());note='Authored loaf exit followed by planted walking';};
$('#ear').onclick=()=>{const a=actors[0];reset(a);window.pixelCatPolishV1.scratchCycleMs=Number($('#ear-rate').value);window.pixelCatEffectsV1.recipes.fur.probability=$('#fur-every').checked?1:.15;a.facing=Number($('#ear-facing').value);a.requestAction('scratch');note='Ear-only timing preview; source pixels and post-scratch holds unchanged';};
// Isolated real emitter/physics: no saved art or live-world particles are modified.
$('#fur-audit').onclick=()=>{const canvas=$('#fur-proof'),c=canvas.getContext('2d'),fx=window.pixelCatEffectsV1,rows=window.pixelCatRoamingExtrasV1.idleSequences.scratch.frames[4],chance=fx.recipes.fur.probability;canvas.hidden=false;c.clearRect(0,0,640,215);c.fillStyle='#fff';c.fillRect(0,0,640,215);let visible=0;
 for(const [i,facing]of [1,-1].entries()){const scale=6,place={x:70+i*320,top:20},floor={id:'proof',el:canvas,left:0,top:164},actor={root:document.createElement('div'),scale,facing,ownerKey:'proof',active:true,config:{color:$('#cat-colour').value},support:floor,surfaces:[floor],idle:{pose:'scratch',start:0}};c.fillStyle=actor.config.color;rows.forEach((row,y)=>[...row].forEach((v,x)=>{if(v!=='.')c.fillRect(place.x+(facing<0?23-x:x)*scale,place.top+y*scale,scale,scale);}));fx.recipes.fur.probability=1;fx.groom(actor,{frame:4,rows},place,500);fx.tick(actor,0);for(let t=0;t<=240;t+=20){if(t)fx.tick(actor,t);if(t%120===0){const p=fx.inspect(actor.root)[0];if(!p)continue;const x=facing<0?23-Math.floor((p.x-place.x)/scale):Math.floor((p.x-place.x)/scale),y=Math.floor((p.y-place.top)/scale),clear=rows[y]?.[x]==='.';if(clear)visible++;c.fillStyle=p.colour;c.fillRect(Math.round(p.x),Math.round(p.y)-3,3,3);c.fillStyle='#243442';c.fillText(t+'ms',p.x+(facing>0?-36:9),p.y-5);}}fx.leave(actor);c.fillStyle='#243442';c.fillText(facing>0?'Facing right':'Facing left',place.x,190);}
 fx.recipes.fur.probability=chance;canvas.dataset.visibleSamples=String(visible);note='Actual ear-contact emitter: '+visible+'/6 sampled origins outside the silhouette; birth / 120 / 240ms. Colour is the cat colour.';
};
$('#vertical').onclick=()=>{for(const a of actors){a.debug.verticalSurfaces=!a.debug.verticalSurfaces;a.invalidate();a.renderDebug();}};
$('#lift').onclick=()=>{const canvas=$('#grip'),c=canvas.getContext('2d'),clip=window.pixelCatRoamingExtrasV1.lifted;canvas.hidden=false;c.clearRect(0,0,320,150);for(const [i,facing]of [1,-1].entries()){const left=10+i*160,top=10,scale=4;c.fillStyle='#222';clip.rows.forEach((row,y)=>[...row].forEach((v,x)=>{if(v!=='.')c.fillRect(left+(facing<0?23-x:x)*scale,top+y*scale,scale,scale);}));const p=window.pixelCatDragV1.grip(clip,facing);c.strokeStyle='#df3333';c.beginPath();c.arc(left+p[0]*scale,top+p[1]*scale,5,0,Math.PI*2);c.stroke();c.fillText(facing>0?'Right · POI cell 11,3':'Left · mirrored POI',left,125);}};
setInterval(()=>{if($('#hold-contact').checked){const a=actors[0];if(a.social?.episode?.stage==='stroke'&&a.idle?.pose==='postScratch'&&performance.now()-a.idle.start>2200)a.paused=true;}$('#state').textContent=note+'\nLayout '+JSON.stringify(window.pixelCatLayoutV1.report(actors[0]?.root))+'\nEffects '+JSON.stringify(window.pixelCatEffectsV1.report(actors[0]?.root))+'\nParticle samples '+JSON.stringify(window.pixelCatEffectsV1.inspect(actors[0]?.root))+'\nTracks '+JSON.stringify(window.pixelCatTrackRuntimeV1.report(window.pixelCatRoamingExtensionsV1.idleSequences.postScratch))+'\n'+actors.map(a=>JSON.stringify({name:a.config.name,lifeStage:a.lifeStage,bodyScale:a.scale,worldScale:a.worldScale,postScale:a.homePost?.scale,postWiggle:a.homePost?.node?.style.translate,strokeEvents:a.getAttribute('data-scratch-stroke'),paused:a.paused,layout:a.layoutPaused,suspended:a.suspended,bedEntry:a.getAttribute('data-bed-entry'),transition:a.getAttribute('data-transition'),frame:a.getAttribute('data-frame'),pose:a.idle?.pose,depth:a.layer?.style.zIndex,postDepth:a.postRenderLayer?.style.zIndex,surfaces:a.surfaces?.length,route:a.surfaceRouteStats,vertical:a.verticalFaces?.length,scratch:a.social?.scratchStats,episode:a.social?.episode?.kind,stage:a.social?.episode?.stage,trace:a.social?.trace?.slice(0,2)})).join('\n');},500);
