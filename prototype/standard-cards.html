<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Standard card surface contracts</title><script defer src="../frame-studio/dist/lab-nav.js"></script><link rel="stylesheet" href="card-lab-preview.css"><style>body{margin:0;background:#edf1f5;font:14px system-ui;color:#263749}header{position:sticky;top:0;height:64px;background:#253c4d;color:white;z-index:20;display:flex;align-items:center;padding:0 20px}main{max-width:1320px;margin:auto;padding:70px 24px 120px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:70px 24px}main>*{min-width:0}hr{border:0;border-top:1px solid #9caaba;margin:24px 0}hui-divider-row{display:block;margin:18px 0}.notice{padding:20px}footer{padding:20px}@media(max-width:900px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){main{grid-template-columns:1fr}}</style></head><body><header>Default-card contracts · local compatibility fixtures, not the HA frontend</header><main data-cat-world><pixel-cat-home></pixel-cat-home></main><footer>Cards use HA Card Lab's local compatibility elements. Divider markup follows the inspected HA source contract. Test actual HA rendering on Testing → Cat playground.</footer><script type="module">
import '../pixel-cat-roaming-art.js';import '../pixel-cat-roaming-extras.js';import '../pixel-cat-affordances.js';import '../pixel-cat-behaviours.js';import '../pixel-cat-roaming.js';import '../pixel-cat-climbing.js';import './card-lab-builtins.js';import './inspection-debug.js';
// This tiny fixture reproduces the structural divider contract, not the complete HA component.
class DividerFixture extends HTMLElement{constructor(){super();this.attachShadow({mode:'open'}).innerHTML='<div style="height:1px;background:#9caaba"></div>';}}if(!customElements.get('hui-divider-row'))customElements.define('hui-divider-row',DividerFixture);
const configs=await(await fetch('default-card-configs.json')).json(),states={};for(const [entity,state,unit]of [['sensor.average_indoor_temp','21','°C'],['sensor.hue_outdoor_motion_sensor_1_temperature','14','°C'],['sensor.ep_lite_with_co2_co2','680','ppm']])states[entity]={entity_id:entity,state,attributes:{friendly_name:entity.split('.')[1].replaceAll('_',' '),unit_of_measurement:unit}};
const hass={states,callService:()=>Promise.resolve(),callWS:()=>Promise.resolve([]),localize:key=>key,themes:{darkMode:false},config:{unit_system:{temperature:'°C'}}},main=document.querySelector('main'),home=document.querySelector('pixel-cat-home');
home.setConfig({cat_id:'standard-fixture-cat',cell_size:2,debug_surfaces:true,debug_pois:true,debug_paths:true});
for(const config of [configs[0],configs[1],configs[3],configs[2],configs[6],configs[4],configs[5],configs[7]]){const card=document.createElement('hui-'+config.type+'-card');card.setConfig(config);card.hass=hass;main.append(card);
 if(config.type==='entities'){const list=card.querySelector('.lab-entities');list.replaceChildren();for(const entry of config.entities){if(entry.type==='divider'){list.append(document.createElement('hui-divider-row'));continue;}const row=document.createElement('div');row.style.cssText='display:flex;justify-content:space-between;padding:14px 0';const name=document.createElement('span'),value=document.createElement('b');name.textContent=states[entry].attributes.friendly_name;value.textContent=states[entry].state;row.append(name,value);list.append(row);}}
 if(config.type==='markdown'){const box=card.querySelector('.lab-markdown');box.replaceChildren();for(const text of config.content.split('\n\n')){const node=document.createElement(text==='---'?'hr':'p');if(text!=='---')node.textContent=text;box.append(node);}}
}
const registry=document.modelContext,result=value=>({content:[{type:'text',text:JSON.stringify(value)}]});if(registry?.registerTool){registry.registerTool({name:'get_standard_fixture_state',description:'Read measured surfaces, candidates, native-card audit and active jump physics in this local compatibility fixture.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>result({surfaces:(home.surfaces||[]).map(({id,label,top,left,right,source,candidate})=>({id,label,top,left,right,source,candidate})),candidates:(home.surfaceCandidates||[]).map(({id,label,top})=>({id,label,top})),audit:home.surfaceAudit,support:home.support?.id,pose:home.idle?.pose,motion:home.motion&&{kind:home.motion.kind,target:home.motion.target.id,profile:home.motion.profile,seconds:home.motion.jumpProfile?.flight.seconds,vx:home.motion.jumpProfile?.flight.vx,vy:home.motion.jumpProfile?.flight.vy},route:(home.route||[]).map(s=>s.settle?'settle:'+s.surface.id:s.id),status:home.shadowRoot.querySelector('.status').textContent})});registry.registerTool({name:'visit_standard_fixture_surface',description:'Route the decorative cat to a measured, enabled surface in the local fixture.',inputSchema:{type:'object',properties:{id:{type:'string'}},required:['id'],additionalProperties:false},execute:({id})=>{if(!home.surfaces?.some(s=>s.id===id))throw Error('Unknown or disabled target');home.requestVisit(id,'interested');return result({destination:id});}});}
</script></body></html>
