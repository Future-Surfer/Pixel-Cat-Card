<!doctype html><meta charset="utf-8"><title>Pixel Cat lifecycle lab</title>
<style>body{font:15px system-ui;background:#edf0f4;color:#243442;margin:20px}main{max-width:1100px;margin:auto}button,select{padding:8px;margin:4px}#stage{position:relative;height:340px}article{position:absolute;background:white;border:1px solid #9aaabc;box-sizing:border-box;padding:8px}#floor{left:0;right:0;top:260px;height:55px}#landing{left:400px;right:0;top:150px;height:50px}#home{width:360px}pre{white-space:pre-wrap;background:white;padding:12px}dialog{max-width:400px}</style>
<main data-cat-world><h1>Layout, lifecycle and handoffs</h1><p>Controlled fixtures use actual controller playback and shared prop ownership. Changes affect this lab only.</p>
<button id="reset">Reset fixture</button><button id="resize">Animate card height</button><button id="remove">Remove walking target</button><button id="carry">Carry a mouse</button><button id="drop-scroll">Drop mouse while scrolling</button><button id="scratch">Scratch home post</button><button id="hide-post">Hide scratching post</button><button id="modal">Open blocking dialog</button><button id="hide">Toggle home visibility</button><button id="remount">Remount 20 times</button><button id="view">Switch lab view</button><button id="cached-view">Cached dashboard return</button>
<label>Pose <select id="pose"><option>loaf</option><option>alertLying</option><option>backRoll</option><option>sleep</option><option>clean</option><option>scratch</option><option>sit</option><option>yawn</option></select></label><button id="rest">Preview rest pose</button><button id="walk">Leave pose walking</button><label>Scale <select id="scale"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label><button id="turn">Change facing</button>
<div id="stage"><article id="floor" data-cat-surface>Broad floor</article><article id="landing" data-cat-surface>Nested / removable target</article></div><div id="home"></div><pre id="report">Loading</pre><div style="height:100vh" aria-hidden="true"></div></main><dialog><p>Blocking dashboard dialog; cats should suspend.</p><button id="close">Close dialog</button></dialog>
<script type="module">
import '../pixel-cat-roaming-art.js';import '../pixel-cat-roaming-extras.js';import '../pixel-cat-affordances.js';import '../pixel-cat-behaviours.js';import '../pixel-cat-roaming.js';import '../pixel-cat-climbing.js';
const $=s=>document.querySelector(s),art={...window.pixelCatRoamingArtV2,...window.pixelCatRoamingExtrasV1,idleSequences:{...window.pixelCatRoamingArtV2.idleSequences,...window.pixelCatRoamingExtrasV1.idleSequences}},a=document.createElement('pixel-cat-home');let note='Ready';
function config(){return {...a.constructor.getStubConfig(),cat_id:'lifecycle-auditor',name:'Lifecycle auditor',arrival:undefined,cell_size:Number($('#scale').value),show_controls:true,debug_labels:true,dashboard_props:false,bowl_eating:false,mood_behaviour:false,social_behaviour:false,interaction_behaviour:false,prop_reactions:false,landing_reactions:false};}
a.setConfig(config());$('#home').append(a);
function reset(){a.social?.finish('lab reset');a.cancelPlay();a.motion=null;a.route=[];a.goal=a.command=null;a.previewPose=null;a.paused=false;a.idle=null;a.deadline=performance.now()+120000;a.measure();a.support=a.surfaces.find(s=>s.el===$('#floor')&&!s.internal)||a.home;a.x=a.support.min+30*a.scale;a.y=a.support.top;}
$('#reset').onclick=()=>{if(!$('#landing')){const e=document.createElement('article');e.id='landing';e.dataset.catSurface='';e.textContent='Nested / removable target';$('#stage').append(e);}reset();note='Reset';};
$('#resize').onclick=()=>{const e=$('#floor');e.style.transition='top 250ms,height 250ms';e.style.top=e.style.top==='230px'?'260px':'230px';e.style.height=e.style.height==='85px'?'55px':'85px';note='Animated layout change';};
$('#remove').onclick=()=>{reset();const s=a.surfaces.find(s=>s.el===$('#landing')&&!s.internal);if(!s){note='Reset fixture to restore target';return;}a.moveTo(s.min+10*a.scale,s.top,0,'walk',s,performance.now());$('#landing').remove();note='Target removed during actual walking; await automatic geometry recovery';};
$('#carry').onclick=()=>{reset();const scene=a.ensurePropScene();scene.clear();scene.enabled=true;const p=scene.spawn(a,'toy_mouse');if(p){p.claimedBy=a.ownerKey;a.mouthPoint={x:a.x+18*a.scale,y:a.y-10*a.scale};window.pixelCatMouthV1.attach(a,p,performance.now(),art,true);a.mouthState.dropAt=a.mouthState.next=Infinity;}note='Real shared mouse attached; mutate layout or open dialog';};
let scrollEvidence={carrySamples:0,dropSamples:0,maxCarryError:0,maxDropError:0};
$('#drop-scroll').onclick=()=>{const p=a.propScene?.props.find(p=>p.id===a.carriedToy);if(!p){note='Carry a mouse first';return;}window.pixelCatMouthV1.release(a,p,a.propScene,performance.now());window.scrollBy({top:180,behavior:'smooth'});note='Real release fall during smooth page scroll';};
function sampleScroll(){const scene=a.propScene;for(const p of scene?.props||[]){if(p.carrier===a.ownerKey&&a.mouthPoint){const r=p.node.getBoundingClientRect(),l=a.layer.getBoundingClientRect();scrollEvidence.carrySamples++;scrollEvidence.maxCarryError=Math.max(scrollEvidence.maxCarryError,Math.hypot(r.left+r.width/2-l.left-a.mouthPoint.x,r.top+r.height/2-l.top-a.mouthPoint.y));}else if(p.releaseFall){const f=p.releaseFall,s=window.pixelCatMouthV1.surface(a,p),node=s?.rectNode||s?.el;if(!s?.rectSnapshot||!node)continue;const u=Math.min(1,f.elapsed/(f.duration||250)),expected=node.getBoundingClientRect().top+s.top-s.rectSnapshot.top-(f.to-f.from)*(1-u*u);scrollEvidence.dropSamples++;scrollEvidence.maxDropError=Math.max(scrollEvidence.maxDropError,Math.abs(p.node.getBoundingClientRect().bottom-expected));}}requestAnimationFrame(sampleScroll);}requestAnimationFrame(sampleScroll);
$('#scratch').onclick=()=>{reset();a.config.social_behaviour=a.config.interaction_behaviour=true;a.support=a.home;a.x=a.home.min+10*a.scale;a.y=a.home.top;const layer=a.decisionLayer(),face=window.pixelCatVerticalScratchV1.faces(layer).find(f=>f.prop.homeOwner===a&&!f.prop.igloo);note=face&&window.pixelCatVerticalScratchV1.start(layer,face,performance.now())?'Scratch approach requested':'No compatible post stance';};
$('#hide-post').onclick=()=>{a.config.show_scratching_post=false;a.homePost?.node.remove();a.invalidate();note='Post removed during scratch; claim must clear';};
$('#modal').onclick=()=>{$('dialog').showModal();};$('#close').onclick=()=>{$('dialog').close();};
$('#hide').onclick=()=>{a.setConfig({...a.config,show_home:a.config.show_home===false});note='Home visibility changed through normal card configuration';};
$('#remount').onclick=()=>{for(let i=0;i<20;i++){a.remove();$('#home').append(a);}note='20 full disconnect/reconnect cycles';};
$('#view').onclick=()=>{a.remove();setTimeout(()=>{$('#home').append(a);note='Returned from view switch';},1000);};
$('#cached-view').onclick=async()=>{const url=location.href;a.remove();history.replaceState(null,'','/prototype/lifecycle-away');await new Promise(requestAnimationFrame);$('#home').append(a);history.replaceState(null,'',url);await new Promise(requestAnimationFrame);note='Cached card reconnected before URL commit: '+(a.href===location.pathname?'correct dashboard binding':'WRONG dashboard binding');};
$('#rest').onclick=()=>{reset();a.requestAction($('#pose').value);a.forcedIdleUntil=a.deadline=performance.now()+120000;note='Authored pose with normal renderer';};
$('#walk').onclick=()=>{a.previewPose=null;a.urgency='casual';a.moveTo(Math.min(a.support.max,a.x+40*a.scale),a.support.top,0,'walk',a.support,performance.now());note='Actual authored departure then walking';};
$('#turn').onclick=()=>{a.facing=-a.facing;note='Mirrored pose/contact check';};$('#scale').onchange=()=>{a.setConfig({...config(),show_home:a.config.show_home});};
setInterval(()=>{$('#report').textContent=JSON.stringify({note,scrollEvidence,active:a.active,mountPath:a.href,currentPath:location.pathname,support:a.support?.id,motion:a.motion?.kind,pose:a.idle?.pose,frame:a.getAttribute('data-frame'),layout:window.pixelCatLayoutV1.report(a.root),paused:a.paused,suspended:a.suspended,stranded:a.stranded,postClaim:a.homePost?.claimedBy,episode:a.social?.episode?.kind,carried:a.carriedToy,mouseAttached:a.propScene?.props.find(p=>p.id===a.carriedToy)?.node.parentElement===a.layer,overlays:document.querySelectorAll('[data-pixel-cat-overlay]').length,route:a.route?.length,exertion:a.exertion,decision:a.social?.trace?.slice(0,3)},null,2);},250);
</script>

<script defer src="../frame-studio/dist/lab-nav.js" data-workshop-nav="floating"></script>
