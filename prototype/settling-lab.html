<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settled rest lab</title><style>body{font:16px system-ui;background:#e6ece8;color:#24343a;margin:24px}button{padding:10px;margin:5px}main{min-height:650px}#homes{display:flex;gap:24px;margin-top:70px}pixel-cat-home{flex:1}pre{white-space:pre-wrap;height:100px;overflow:auto;font:13px monospace}</style><main data-cat-world><h1>Settled rest</h1><p>Real runtime; buttons advance only the eligibility clock or finish the current timer. Sleep/loaf artwork, startle and rendering use the normal runtime.</p><button id="before">Rest before five minutes</button><button id="after">Rest after five minutes</button><button id="startle">Startle first cat</button><button id="expire">Finish resting timers</button><pre id="report">Loading…</pre><div id="homes"></div></main><script type="module">
import '../pixel-cat-roaming-art.js';import '../pixel-cat-roaming-extras.js';import '../pixel-cat-affordances.js';import '../pixel-cat-behaviours.js';import '../pixel-cat-roaming.js';import '../pixel-cat-climbing.js';
const actors=window.settlingLabActors=[];for(const [i,age] of ['kitten','adult','senior'].entries()){const a=document.createElement('pixel-cat-home');a.setConfig({...a.constructor.getStubConfig(),cat_id:'settling-lab-'+age,name:age,life_stage:age,arrival:undefined,cell_size:3,show_controls:true,interaction_behaviour:false,social_behaviour:false,debug_labels:true});document.querySelector('#homes').append(a);actors.push(a);}
function rest(after){for(const [i,a] of actors.entries()){const t=performance.now(),pose=i===1?'sleep':'loaf';a.previewPose=null;a.forcedIdleUntil=0;a.command=null;a.goal=null;a.route=[];a.motion=null;a.play=null;a.playRequested=false;a.toyHunt=null;a.toyHuntRequested=false;a.settling={activeMs:after?300000:0,idle:null};a.removeAttribute('data-settling');a.idle={pose,start:t,bridge:[],bridgeMs:0,poseUntil:t+10000,support:a.support.id,contactX:a.x+17*a.scale};a.deadline=t+10000;window.pixelCatPostRestV1.idleStarted(a,a.idle,{idleSequences:{...window.pixelCatRoamingArtV2.idleSequences,...window.pixelCatRoamingExtrasV1.idleSequences,...window.pixelCatRoamingExtensionsV1.idleSequences}});}}
document.querySelector('#before').onclick=()=>rest(false);document.querySelector('#after').onclick=()=>rest(true);document.querySelector('#startle').onclick=()=>{const a=actors[0];a.requestStartle({x:a.x+30,y:a.y},performance.now());};document.querySelector('#expire').onclick=()=>{for(const a of actors)if(a.settling?.idle){a.idle.poseUntil=performance.now();a.deadline=performance.now();}};
setInterval(()=>{document.querySelector('#report').textContent=JSON.stringify(actors.map(a=>({age:a.config.life_stage,pose:a.idle?.pose,state:a.getAttribute('data-settling')||'ordinary',activeSeconds:Math.round((a.settling?.activeMs||0)/1000),remainingSeconds:Math.round(Math.max(0,(a.idle?.poseUntil||0)-performance.now())/1000),decisionClock:a.social?.clock})),null,2);},250);
</script><script src="../frame-studio/dist/lab-nav.js" defer></script></html>
