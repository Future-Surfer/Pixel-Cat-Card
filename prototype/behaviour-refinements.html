<!doctype html><html lang="en"><meta charset="utf-8"><title>Cat action refinements lab</title><style>body{margin:0;background:#eef1f5;color:#243442;font:15px system-ui}main{position:relative;max-width:1000px;margin:auto;padding:20px}button{padding:10px;margin:6px}.platforms{display:flex;gap:80px;margin:110px 0 30px}.platforms article{background:#fff;border:1px solid #aab4bf;border-radius:12px;padding:16px;flex:1;height:110px}pixel-cat-home{max-width:760px}output{display:block;white-space:pre-wrap;margin:20px 0}</style>
<main data-cat-world><h1>Reviewed scratching post · real route and contact</h1><p>Request the authored post affordance explicitly to inspect alignment. Natural opportunities additionally require notice and a low weighted decision.</p><label>Post <select id="post-source"><option value="loose">Loose post</option><option value="home">Home post</option></select></label><label>Face <select id="post-face"><option value="1">Left face · cat faces right</option><option value="-1">Right face · cat faces left</option></select></label><label>Pixel scale <select id="post-scale"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select></label><button id="scratch">Place post and approach</button><button id="invite-ready">Prepare click invitation</button><label><input id="freeze" type="checkbox" checked> Freeze mid-stroke for inspection</label><button id="meal">Preview post-meal preference</button><div class="platforms"><article data-cat-surface>Walking surface A</article><article data-cat-surface>Walking surface B</article></div><div id="home"></div><output id="state"></output></main>
<script type="module">import '../pixel-cat-roaming-art.js';import '../pixel-cat-roaming-extras.js';import '../pixel-cat-affordances.js';import '../pixel-cat-behaviours.js';import '../pixel-cat-roaming.js';const a=document.createElement('pixel-cat-home');a.setConfig({...a.constructor.getStubConfig(),cat_id:'action-lab',name:'Olive',arrival:undefined,cell_size:3,show_controls:true,dashboard_props:false,bowl_eating:false,debug_labels:true});document.querySelector('#home').append(a);
document.querySelector('#post-scale').onchange=()=>a.setConfig({...a.config,cell_size:Number(document.querySelector('#post-scale').value)});
const place=invite=>{a.paused=false;a.social?.finish('lab reset');a.motion=null;a.route=[];a.goal=a.command=null;a.previewPose=null;a.play=null;a.idle=null;a.deadline=performance.now()+120000;a.measure();const scene=a.ensurePropScene();scene.clear();scene.enabled=true;const home=document.querySelector('#post-source').value==='home',p=home?a.homePost:scene.spawn(a,'scratching_post');if(!p){document.querySelector('#state').textContent='No eligible prop placement';return;}p.cooldownUntil=0;p.inviteAfter=0;scene.tick(performance.now(),a);const layer=a.decisionLayer(),face=window.pixelCatVerticalScratchV1.faces(layer).find(f=>!!f.prop.homeOwner===home&&f.direction===Number(document.querySelector('#post-face').value));if(invite&&face){a.support=face.surface;a.x=Math.max(face.surface.min,face.origin-24*a.scale);a.y=face.surface.top;const t=performance.now();a.idle={pose:'sit',start:t,poseUntil:t+120000,support:a.support.id,contactX:a.x+12*a.scale,bridge:[],bridgeMs:0};a.deadline=t+120000;document.querySelector('#state').textContent='Click the post or focus it and press Enter; the cat may decline';return;}document.querySelector('#state').textContent=face&&window.pixelCatVerticalScratchV1.start(layer,face,performance.now())?'Approaching the post':'No clear scratching stance';};
document.querySelector('#scratch').onclick=()=>place(false);document.querySelector('#invite-ready').onclick=()=>place(true);
document.querySelector('#meal').onclick=()=>window.pixelCatPostRestV1.afterMeal(a);
document.querySelector('#freeze').onchange=()=>{a.paused=false;};setInterval(()=>{if(document.querySelector('#freeze').checked&&a.social?.episode?.stage==='stroke'&&a.idle?.pose==='postScratch'&&performance.now()-a.idle.start>1400)a.paused=true;document.querySelector('#state').textContent=(JSON.stringify(a.social?.trace?.slice(0,8))||'Starting')+'\n'+(a.social?.episode?.kind||'independent')+' / '+(a.social?.episode?.stage||a.idle?.pose||'—')+'\nscale '+a.scale+' · facing '+a.facing+' · rear bearing '+(a.social?.episode?.bearing??'—')+' · revision '+(a.homePost?.asset.sourceRevision??'—')+' · available '+a.social?.available(a)+' / '+a.social?.unavailableReason(a)+' · faces '+(a.social?window.pixelCatVerticalScratchV1.faces(a.social).map(f=>f.id).join(','):'—')+' · invitation '+(a.homePost?.node.dataset.scratchResponse||a.propScene?.props.find(p=>p.asset.affordance==='scratch')?.node.dataset.scratchResponse||'—')+'\n'+(a.getAttribute('data-post-rest')||'');},200);</script></html>
